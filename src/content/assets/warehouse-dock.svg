<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#dockBg)"/>
  <rect x="1" y="1" width="598" height="448" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="30" y="25" width="540" height="40" rx="8" fill="#1e293b"/>
  <text x="45" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Gestão Inteligente de Docas • Centro de Distribuição Central</text>
  <rect x="470" y="32" width="85" height="25" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="480" y="49" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">● 6 DOCAS LIVRES</text>

  <!-- Dock Bays representation -->
  <!-- Dock 1 -->
  <g transform="translate(40, 90)">
    <rect width="150" height="150" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="15" y="15" width="55" height="22" rx="4" fill="#0284c7"/>
    <text x="24" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">DOCA 01</text>
    <text x="15" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Carreta Rodotrem</text>
    <text x="15" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Placa: BRA-9021</text>
    <rect x="15" y="105" width="120" height="6" rx="3" fill="#334155"/>
    <rect x="15" y="105" width="95" height="6" rx="3" fill="#0284c7"/>
    <text x="15" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">80% Carregado</text>
  </g>

  <!-- Dock 2 -->
  <g transform="translate(225, 90)">
    <rect width="150" height="150" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="55" height="22" rx="4" fill="#10b981"/>
    <text x="24" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">DOCA 02</text>
    <text x="15" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Truck Graneleiro</text>
    <text x="15" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Placa: RIO-4412</text>
    <rect x="15" y="105" width="120" height="6" rx="3" fill="#334155"/>
    <rect x="15" y="105" width="120" height="6" rx="3" fill="#10b981"/>
    <text x="15" y="130" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Liberado p/ Partida</text>
  </g>

  <!-- Dock 3 -->
  <g transform="translate(410, 90)">
    <rect width="150" height="150" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="15" width="55" height="22" rx="4" fill="#f59e0b"/>
    <text x="24" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">DOCA 03</text>
    <text x="15" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Bitrem Frigorífico</text>
    <text x="15" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Placa: SPX-1120</text>
    <rect x="15" y="105" width="120" height="6" rx="3" fill="#334155"/>
    <rect x="15" y="105" width="40" height="6" rx="3" fill="#f59e0b"/>
    <text x="15" y="130" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Iniciando Descarregamento</text>
  </g>

  <!-- Bottom Schedule timeline -->
  <g transform="translate(40, 265)">
    <rect width="520" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Grade de Agendamentos (Hoje)</text>
    
    <!-- Timeline item 1 -->
    <rect x="20" y="48" width="480" height="28" rx="6" fill="#0f172a"/>
    <text x="35" y="66" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">14:00 - 15:30</text>
    <text x="140" y="66" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Carga Express SP • Doca 01</text>
    <text x="410" y="66" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Confirmado</text>

    <!-- Timeline item 2 -->
    <rect x="20" y="82" width="480" height="28" rx="6" fill="#0f172a"/>
    <text x="35" y="100" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">15:45 - 17:00</text>
    <text x="140" y="100" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">TransNorte Cargas • Doca 04</text>
    <text x="410" y="100" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Em trânsito</text>

    <!-- Timeline item 3 -->
    <rect x="20" y="116" width="480" height="24" rx="6" fill="#0f172a"/>
    <text x="35" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">17:15 - 18:30</text>
    <text x="140" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">LogVale Soluções • Doca 02</text>
    <text x="410" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Agendado</text>
  </g>
</svg>
