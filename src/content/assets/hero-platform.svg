    <text x="772" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">● COPILOT ATIVO</text>

    <!-- Chat Bubbles -->
    <!-- Client message -->
    <rect x="320" y="70" width="310" height="50" rx="12" fill="#20114a"/>
    <text x="335" y="92" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Olá! Preciso da segunda via da fatura</text>
    <text x="335" y="108" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">que venceu ontem, por favor.</text>
    <text x="590" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">14:28</text>

    <!-- AI Bot Message -->
    <rect x="470" y="135" width="385" height="95" rx="12" fill="url(#purpleGlow)"/>
    <text x="490" y="158" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">⚡ Localize AI Copilot:</text>
    <text x="490" y="178" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="12">Localizei seu contrato nº 88319! Aqui está seu</text>
    <text x="490" y="196" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="12">código PIX copia-e-cola com valor atualizado:</text>
    <text x="490" y="214" fill="#fef08a" font-family="monospace" font-size="10" font-weight="bold">00020126580014br.gov.bcb.pix...</text>

    <!-- Flow Suggestion / Action Trigger -->
    <rect x="320" y="250" width="535" height="75" rx="12" fill="#180e3b" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="340" y="275" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">AÇÃO RECOMENDADA PELO FLUXO DE RETENÇÃO:</text>
    <text x="340" y="295" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">"Deseja aplicar desconto de pontualidade de 5% no próximo mês se pago hoje?"</text>
    <rect x="730" y="280" width="110" height="28" rx="6" fill="#7c3aed"/>
    <text x="745" y="298" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Disparar Oferta</text>

    <!-- Input bar -->
    <rect x="320" y="340" width="535" height="34" rx="8" fill="#1a0f3d" stroke="#3b1f7e" stroke-width="1"/>
    <text x="335" y="362" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Digite uma mensagem ou / para invocar automações...</text>
  </g>
</svg>
