  <rect x="2" y="30" width="996" height="20" fill="#130b2c"/>
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>
  
  <rect x="280" y="12" width="440" height="24" rx="12" fill="#1e1245" stroke="#371d78" stroke-width="1"/>
