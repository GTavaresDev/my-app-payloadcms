    <text x="693" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CSAT MÉDIO</text>
    <text x="693" y="65" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="26" font-weight="800">4.92 ★</text>
