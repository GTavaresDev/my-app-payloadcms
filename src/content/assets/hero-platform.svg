    <circle cx="35" cy="325" r="15" fill="#8b5cf6"/>
    <text x="35" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✉</text>
    <text x="60" y="320" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">contato@parceiro.com</text>
    <text x="60" y="338" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Ticket #8912 categorizado</text>

    <!-- Chat Active Conversation (Right) -->
    <rect x="295" y="0" width="585" height="385" rx="14" fill="#120a2e" stroke="#2a165b" stroke-width="1"/>
