<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="localizeHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#110d24"/>
      <stop offset="100%" stop-color="#180e36"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1000" height="600" rx="20" fill="url(#localizeHeroBg)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="996" height="596" rx="19" fill="none" stroke="#2e1a5a" stroke-width="1.5"/>

  <!-- Top Window Header -->
