    <text x="243" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RESOLUÇÃO AUTÔNOMA</text>
    <text x="243" y="65" fill="#a855f7" font-family="system-ui, sans-serif" font-size="26" font-weight="800">81.4%</text>
