    <text x="18" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CONVERSAS ATIVAS</text>
    <text x="18" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="800">4.892</text>
    <rect x="135" y="20" width="55" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="145" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">+14.2%</text>

    <!-- Card 2 -->
