  <rect x="22" y="130" width="30" height="30" rx="8" fill="#241352"/>
  <rect x="22" y="175" width="30" height="30" rx="8" fill="#180e36"/>
  <rect x="22" y="220" width="30" height="30" rx="8" fill="#180e36"/>
  <rect x="22" y="265" width="30" height="30" rx="8" fill="#180e36"/>

  <!-- Main Dashboard Area -->
