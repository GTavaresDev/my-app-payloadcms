<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c071d"/>
      <stop offset="100%" stop-color="#180e3b"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="flowGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#2d1964" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="700" height="500" rx="16" fill="url(#flowBg)"/>
  <rect width="700" height="500" rx="16" fill="url(#flowGrid)"/>
  <rect x="1" y="1" width="698" height="498" rx="15" fill="none" stroke="#351a70" stroke-width="1.5"/>

  <!-- Top bar of canvas -->
  <rect x="25" y="20" width="650" height="40" rx="8" fill="#1b0f42" stroke="#3b1f7d" stroke-width="1"/>
  <text x="45" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Editor de Fluxo: Onboarding de Clientes e Triagem de IA</text>
  <rect x="560" y="28" width="100" height="24" rx="12" fill="#10b981" fill-opacity="0.2"/>
  <text x="575" y="44" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">● PUBLICADO</text>

  <!-- Connective wires -->
  <path d="M 180 160 C 230 160, 230 250, 280 250" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 440 250 C 490 250, 490 170, 530 170" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 440 250 C 490 250, 490 350, 530 350" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Node 1: Trigger -->
  <g transform="translate(40, 110)">
    <rect width="150" height="100" rx="12" fill="#180e38" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="12" y="12" width="30" height="30" rx="8" fill="url(#nodeGrad1)"/>
    <text x="27" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">⚡</text>
    <text x="50" y="30" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">GATILHO INICIAL</text>
    <text x="14" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Nova mensagem</text>
    <text x="14" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">WhatsApp / Instagram</text>
    <circle cx="150" cy="50" r="5" fill="#8b5cf6"/>
  </g>

  <!-- Node 2: AI Classification & Analysis -->
  <g transform="translate(280, 200)">
    <rect width="170" height="110" rx="12" fill="#180e38" stroke="#06b6d4" stroke-width="2"/>
    <rect x="12" y="12" width="30" height="30" rx="8" fill="url(#nodeGrad2)"/>
    <text x="27" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🤖</text>
    <text x="50" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ANÁLISE DE INTENÇÃO</text>
    <text x="14" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">IA LLM Classificadora</text>
    <text x="14" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Sentimento &amp; Urgência</text>
    <circle cx="0" cy="50" r="5" fill="#8b5cf6"/>
    <circle cx="170" cy="50" r="5" fill="#06b6d4"/>
  </g>

  <!-- Node 3: Condition Branch A (Success / Automated) -->
  <g transform="translate(520, 115)">
    <rect width="150" height="95" rx="12" fill="#180e38" stroke="#10b981" stroke-width="2"/>
    <rect x="12" y="12" width="30" height="30" rx="8" fill="url(#nodeGrad3)"/>
    <text x="27" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">✓</text>
    <text x="50" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SE FAQ / SIMPLES</text>
    <text x="14" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Resposta Autônoma</text>
    <text x="14" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Resolução em 3s</text>
    <circle cx="0" cy="45" r="5" fill="#10b981"/>
  </g>

  <!-- Node 4: Condition Branch B (Complex / Hand-off) -->
  <g transform="translate(520, 295)">
    <rect width="150" height="95" rx="12" fill="#180e38" stroke="#f59e0b" stroke-width="2"/>
    <rect x="12" y="12" width="30" height="30" rx="8" fill="#d97706"/>
    <text x="27" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">👤</text>
    <text x="50" y="30" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SE ALTO VALOR</text>
    <text x="14" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Transfere Atendente</text>
    <text x="14" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Com resumo pronto</text>
    <circle cx="0" cy="45" r="5" fill="#f59e0b"/>
  </g>

  <!-- Bottom stat bar -->
  <rect x="25" y="435" width="650" height="40" rx="8" fill="#140a33"/>
  <text x="45" y="460" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">⚡ 28.940 execuções deste fluxo nas últimas 24 horas • Taxa de sucesso: 99.4%</text>
</svg>
